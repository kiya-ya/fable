<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训师用户端</title>
<link rel="stylesheet" href="/style.css">
<style>
.portal-login { max-width: 420px; margin: 8vh auto; }
.portal-login label { display: block; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
.portal-login input { width: 100%; margin-top: 4px; }
.captcha-row { display: flex; gap: 8px; align-items: center; }
.captcha-code {
  font-family: monospace; font-size: 22px; letter-spacing: 4px;
  background: #f3f4f6; padding: 6px 12px; border-radius: 6px; user-select: all;
  font-weight: 700; color: #1f2937;
}
.portal-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.portal-top h2 { margin: 0; }
</style>
</head>
<body>
<header><h1>培训师用户端</h1></header>
<main>
  <!-- 登录 -->
  <div id="portal-login" class="card portal-login">
    <h2>培训师登录</h2>
    <div class="muted" style="margin-bottom:12px">输入你的 UID 和验证码；仅培训师可进入</div>
    <label>UID <input id="p-uid" type="text" placeholder="请输入你的 UID"></label>
    <label>验证码（5 位数字字母）
      <div class="captcha-row">
        <input id="p-code" type="text" maxlength="5" placeholder="输入右侧字符" style="flex:1">
        <span id="p-captcha" class="captcha-code" title="点击刷新">-----</span>
      </div>
    </label>
    <button id="p-login" class="btn primary" style="width:100%;padding:10px">进入系统</button>
    <div class="muted" style="margin-top:10px;font-size:12px">验证码看不清？点字符刷新</div>
  </div>

  <!-- 主界面 -->
  <div id="portal-main" class="hidden">
    <div class="card portal-top">
      <h2 id="p-welcome"></h2>
      <div>
        <a href="/portal" id="p-logout" style="font-size:13px;color:#6b7280">退出登录</a>
      </div>
    </div>

    <div class="card">
      <h2>我的名额</h2>
      <div id="p-slots-summary" class="slot-summary"></div>
      <div class="muted" style="font-size:12px;margin-bottom:8px">
        额外名额按学员当月排档周最高等级计算（初银+1/银牌+1/金牌+1，需当周排档天数&gt;0），当月达标当月生效，次月按新月等级重算
      </div>
      <table>
        <thead><tr><th>妹妹</th><th>UID</th><th>绑定时间</th><th>当月最高等级</th><th>贡献名额</th><th>最后查询</th></tr></thead>
        <tbody id="p-trainees"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>绑定新妹妹</h2>
      <div class="muted" style="margin-bottom:10px">培训师固定为你自己，只需输入妹妹 UID；妹妹须在保护期内</div>
      <div class="bind-form">
        <label>妹妹 UID
          <input id="p-bind-uid" type="text" placeholder="输入妹妹 UID">
        </label>
        <button id="p-lookup" class="btn">查询</button>
        <button id="p-bind" class="btn primary">绑定</button>
      </div>
      <div id="p-bind-info" class="lookup-info"></div>
    </div>
  </div>
</main>
<div id="toast" class="hidden"></div>
<script src="/portal.js"></script>
</body>
</html>
