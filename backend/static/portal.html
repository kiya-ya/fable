<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训师用户端</title>
<link rel="icon" href="/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/brand.css">
<style>
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
}
.login-logo { margin-bottom: 26px; }
.login-logo img {
  width: 148px; height: 148px; border-radius: 32px;
  box-shadow: 0 12px 32px rgba(122, 62, 18, .2);
}
.portal-login { width: 360px; max-width: 92vw; }
.portal-login label { display: block; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
.portal-login input { width: 100%; margin-top: 4px; }
.captcha-row { display: flex; gap: 8px; align-items: center; }
.captcha-code {
  font-family: monospace; font-size: 22px; letter-spacing: 4px;
  background: #f3f4f6; padding: 6px 12px; border-radius: 6px; user-select: all;
  font-weight: 700; color: #1f2937;
}
.portal-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.portal-top h2 { margin: 0; }
main { width: 100%; }
body.logged-in { display: block; }
#portal-login-logo.hidden { display: none; }
</style>
</head>
<body>
<div class="bg-decor"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i></div>
  <!-- 登录（LOGO 居中 + 下方登录框，无顶栏） -->
  <div class="login-logo" id="portal-login-logo"><img src="/logo.jpg" alt="点点开黑 LOGO"></div>
  <div id="portal-login" class="card portal-login">
    <h2>培训师登录</h2>
    <div class="muted" style="margin-bottom:12px">输入你的 UID 和验证码；仅培训师可进入</div>
    <label>UID <input id="p-uid" type="text" placeholder="请输入你的 UID"></label>
    <label>密码 <input id="p-password" type="password" placeholder="初始密码为 UID 后 5 位，登录后请修改密码"></label>
    <label>验证码（5 位数字字母）
      <div class="captcha-row">
        <input id="p-code" type="text" maxlength="5" placeholder="输入右侧字符" style="flex:1">
        <span id="p-captcha" class="captcha-code" title="点击刷新">-----</span>
      </div>
    </label>
    <button id="p-login" class="btn primary" style="width:100%;padding:10px">进入系统</button>
    <div class="muted" style="margin-top:10px;font-size:12px">验证码看不清？点字符刷新</div>
  </div>

  <!-- 主界面 -->
  <div id="portal-main" class="hidden">
    <div class="card portal-top">
      <div class="portal-welcome">
        <img src="/logo.jpg" alt="LOGO">
        <div>
          <div class="who" id="p-welcome"></div>
          <div class="sub">我的学员与名额</div>
        </div>
      </div>
      <div>
        <button id="p-change-pwd" class="btn small">修改密码</button>
        <button id="p-logout" class="btn small">退出登录</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>我的名额</h2>
        <button id="p-refresh" class="btn">刷新数据</button>
      </div>
      <div id="p-slots-summary" class="slot-summary"></div>
      <button id="p-slots-help-toggle" class="help-toggle" type="button">名额计算说明 <span id="p-help-arrow">▸</span></button>
      <div id="p-slots-help" class="muted hidden" style="font-size:12px;margin:6px 0 8px">
        额外名额按学员当月排档周最高等级计算（初银+1/银牌+1/金牌+1，需当周排档天数&gt;0），当月达标当月生效，次月按新月等级重算
      </div>
      <button id="p-trainees-toggle" class="help-toggle" type="button">学员列表 <span id="p-trainees-arrow">▸</span></button>
      <div id="p-trainees" class="p-trainee-list hidden"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>已发放奖励</h2>
        <button id="p-granted-refresh" class="btn small">刷新</button>
      </div>
      <button id="p-granted-toggle" class="help-toggle hidden" type="button">展开全部 <span id="p-granted-arrow">▸</span></button>
      <div id="p-granted-first" class="p-trainee-list"></div>
      <div id="p-granted" class="p-trainee-list hidden"></div>
    </div>

    <div class="card">
      <h2>绑定新妹妹</h2>
      <div class="muted" style="margin-bottom:10px">培训师固定为你自己，只需输入妹妹 UID；妹妹须在保护期内</div>
      <div class="bind-form">
        <label>妹妹 UID
          <input id="p-bind-uid" type="text" placeholder="输入妹妹 UID">
        </label>
        <button id="p-lookup" class="btn">查询</button>
        <button id="p-bind" class="btn primary">绑定</button>
      </div>
      <div id="p-bind-info" class="lookup-info"></div>
    </div>
  </div>
</div>
<footer class="app-footer">
  <div class="footer-lines"><span></span><span></span><span></span></div>
  <div class="footer-text">点点开黑 · 享受开黑乐趣</div>
</footer>
<!-- 修改密码弹窗 -->
<div id="pwd-modal" class="modal-mask hidden">
  <div class="modal">
    <h3>修改密码</h3>
    <label>原密码 <input id="pwd-old" type="password"></label>
    <label>新密码（至少 6 位） <input id="pwd-new" type="password"></label>
    <div class="modal-actions">
      <button id="pwd-cancel" class="btn">取消</button>
      <button id="pwd-save" class="btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<button id="back-top" title="回到顶部" aria-label="回到顶部">↑</button>
<script src="/portal.js"></script>
</body>
</html>
