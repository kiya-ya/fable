<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点点开黑 · 统一入口（v2 测试）</title>
<link rel="icon" href="/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/brand.css">
<style>
body {
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding-top: 70px;
}
.landing-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 80;
  display: flex; flex-direction: row; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
}
.lh-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--brown-900, #5b2a06); }
.lh-brand img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 4px 10px rgba(122, 62, 18, .18); }
.v2-login { width: 320px; max-width: 92vw; }
.v2-login label { display: block; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
.v2-login input { width: 100%; margin-top: 4px; }
.v2-tip { margin-top: 12px; font-size: 12px; color: rgba(91,42,6,.6); text-align: center; line-height: 1.8; }
main.v2-main { width: 100%; max-width: 680px; padding: 0 16px; }
.v2-badge { font-size: 11px; color: rgba(91,42,6,.45); text-align: center; margin-bottom: 10px; letter-spacing: 1px; }

/* 欢迎条 */
.v2-hello {
  display: flex; align-items: center; justify-content: space-between;
  margin: 4px 2px 14px; font-size: 16px; font-weight: 700; color: var(--brown-900, #5b2a06);
}

/* 课包大卡 */
.pkg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media (max-width: 560px) { .pkg-grid { grid-template-columns: 1fr; } }
.pkg-card { display: flex; flex-direction: column; padding: 18px; }
.pkg-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.pkg-icon {
  width: 50px; height: 50px; border-radius: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #fff; letter-spacing: 1px;
}
.pkg-head b { font-size: 16px; color: var(--brown-900, #5b2a06); }
.pkg-head p { font-size: 11px; color: rgba(91,42,6,.55); margin-top: 3px; line-height: 1.5; }
.pkg-progress { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.pkg-progress .bar { flex: 1; height: 8px; background: rgba(122,62,18,.08); border-radius: 999px; overflow: hidden; }
.pkg-progress .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #8E6BC8, #F5B301); transition: width .4s ease; }
.pkg-progress .num { font-size: 12px; font-weight: 700; color: var(--brown-700, #7a3e12); }
.pkg-courses { flex: 1; }
.pkg-cat { font-size: 11px; font-weight: 700; color: var(--brown-700, #7a3e12); margin: 8px 0 4px; }
.pkg-course {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 13px; color: #3f2a14; padding: 7px 10px; margin-bottom: 4px;
  background: rgba(142, 107, 200, .08); border-radius: 8px;
}
.pkg-course.opt { background: rgba(245, 179, 1, .10); }
.pkg-course .st { font-size: 11px; font-weight: 700; color: #16a34a; flex-shrink: 0; }
.pkg-course .st.doing { color: #8E6BC8; }
.pkg-course .st.todo { color: rgba(91,42,6,.35); }
.pkg-card.locked .pkg-courses, .pkg-card.locked .pkg-progress { opacity: .5; }

/* 新人指引弹窗 */
.guide-step { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px dashed rgba(122,62,18,.15); }
.guide-step:first-of-type { border-top: none; }
.guide-num {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: var(--brown-700, #7a3e12); color: #fff7ea;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
}
.guide-body { flex: 1; }
.guide-body b { font-size: 14px; color: var(--brown-900, #5b2a06); }
.guide-body p { font-size: 12px; color: rgba(91,42,6,.6); margin-top: 3px; line-height: 1.6; }
</style>
</head>
<body>
<div class="bg-decor"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i></div>
<div class="landing-header">
  <div class="lh-brand"><img src="/logo.jpg" alt="点点开黑 LOGO"><span>点点开黑</span></div>
  <button id="v2-logout" class="btn small hidden">退出登录</button>
</div>

<main class="v2-main">
  <div class="v2-badge">V2 灰度测试版</div>

  <!-- 登录框（A+：单框 + 新人引导文案） -->
  <div id="v2-login" class="card v2-login">
    <label>UID <input id="v2-uid" type="text" placeholder="请输入你的 UID"></label>
    <label>密码 <input id="v2-password" type="password" placeholder="初始密码为 UID 后 5 位"></label>
    <label id="v2-nick-row" class="hidden">昵称（首次登录需补充一次）
      <input id="v2-nickname" type="text" placeholder="请输入你的点点昵称">
    </label>
    <button id="v2-submit" class="btn primary" style="width:100%;padding:10px">进入系统</button>
    <div class="v2-tip">新人？首次登录密码为 UID 后 5 位<br>登录后按指引学习考试</div>
  </div>

  <!-- 主页面（登录后所有人可见）：双大卡 + 真实课程数据 -->
  <div id="v2-main" class="hidden">
    <div class="v2-hello">
      <span id="v2-welcome">欢迎你</span>
      <button id="v2-open-guide" class="btn small hidden">新人指引</button>
    </div>
    <div class="pkg-grid" id="v2-pkg-grid">
      <div class="card" style="text-align:center;color:rgba(91,42,6,.4);grid-column:1/-1">课程加载中…</div>
    </div>
    <div class="card" style="text-align:center">
      <button id="v2-go-query" class="btn">查询我的成绩</button>
    </div>
  </div>

  <!-- 新人指引弹窗（首次登录强制弹出，点击关闭） -->
  <div id="v2-guide-modal" class="modal-mask hidden">
    <div class="modal" style="max-width:440px">
      <h3>新人指引</h3>
      <div class="guide-step">
        <div class="guide-num">1</div>
        <div class="guide-body">
          <b>课程学习</b>
          <p>完成姐妹团必修课（视频看到 90% / 图文读够时长）</p>
        </div>
      </div>
      <div class="guide-step">
        <div class="guide-num">2</div>
        <div class="guide-body">
          <b>参加考试</b>
          <p>必修课全部完成后解锁，60 分及格；挂科 1 天后可重考</p>
        </div>
      </div>
      <div class="guide-step">
        <div class="guide-num">3</div>
        <div class="guide-body">
          <b>申请资质</b>
          <p>考试通过后提交申请，管理员审核通过即激活</p>
        </div>
      </div>
      <div class="modal-actions">
        <button id="v2-guide-golearn" class="btn">去学习</button>
        <button id="v2-guide-close" class="btn primary">我知道了</button>
      </div>
    </div>
  </div>
</main>

<div id="toast" class="hidden"></div>
<script>
const $ = (s) => document.querySelector(s);
let EXAM_URL = 'http://192.168.100.117:5001';
let myUid = '';

function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  setTimeout(() => el.classList.add('hidden'), 3000);
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
async function api(url, options = {}) {
  if (options.body) {
    options.headers = { 'Content-Type': 'application/json' };
    options.body = JSON.stringify(options.body);
  }
  const resp = await fetch(url, options);
  const data = await resp.json().catch(() => ({ ok: false, msg: '响应解析失败' }));
  return { status: resp.status, data };
}

fetch('/api/client-config').then((r) => r.json()).then((c) => {
  if (c.exam_url) EXAM_URL = c.exam_url;
}).catch(() => {});

async function doLogin() {
  const uid = $('#v2-uid').value.trim();
  const password = $('#v2-password').value;
  const nickname = $('#v2-nickname').value.trim();
  if (!uid) return toast('请输入 UID', true);
  if (!password) return toast('请输入密码', true);
  const { status, data } = await api('/api/portal/login', {
    method: 'POST', body: { uid, password, nickname },
  });
  if (data.need_nickname) {
    $('#v2-nick-row').classList.remove('hidden');
    toast(data.msg || '请补充昵称', true);
    return;
  }
  if (!data.ok) return toast(data.msg || '登录失败', true);
  enterApp(data);
}

// 课包卡片渲染（真实数据来自考试系统代理）
function pkgExamBtn(pkg) {
  const es = pkg.exam_status || {};
  const key = pkg.key;
  if (pkg.chain_locked || es.chain_locked) {
    return `<button class="btn" style="width:100%" disabled>进入学习（需先通过姐妹团考试）</button>`;
  }
  if (es.status === 'passed') {
    return `<button class="btn" style="width:100%" disabled>考试已通过 ${esc(es.percentage)} 分</button>`;
  }
  return `<button class="btn primary" style="width:100%" onclick="v2GoPackage('${key}')">进入学习</button>`;
}
function pkgCourseRows(pkg) {
  const req = (pkg.courses || []).filter((c) => c.category !== 'optional');
  const opt = (pkg.courses || []).filter((c) => c.category === 'optional');
  const row = (c) => {
    const st = c.completed ? '<span class="st">已完成</span>'
      : c.progress_percent > 0 ? `<span class="st doing">${Math.floor(c.progress_percent)}%</span>`
      : '<span class="st todo">未开始</span>';
    return `<div class="pkg-course ${c.category === 'optional' ? 'opt' : ''}"><span>${esc(c.title)}</span>${st}</div>`;
  };
  let html = '';
  if (req.length) html += '<div class="pkg-cat">必修课</div>' + req.map(row).join('');
  if (opt.length) html += '<div class="pkg-cat">选修课（不计入考试解锁）</div>' + opt.map(row).join('');
  if (!req.length && !opt.length) html += '<div class="muted" style="font-size:12px;padding:8px 0">课程筹备中</div>';
  return html;
}
function renderPackages(packages) {
  const grid = $('#v2-pkg-grid');
  grid.innerHTML = packages.map((pkg) => {
    const pct = pkg.total_courses ? Math.round(pkg.completed_courses / pkg.total_courses * 100) : 0;
    const lockedCls = (pkg.chain_locked || (pkg.exam_status || {}).chain_locked) ? 'locked' : '';
    const iconBg = pkg.key === 'sister'
      ? 'background:linear-gradient(135deg,#fbc2eb,#f48a8a)' : 'background:linear-gradient(135deg,#a18cd1,#8E6BC8)';
    return `<div class="card pkg-card ${lockedCls}">
      <div class="pkg-head">
        <div class="pkg-icon" style="${iconBg}">${esc(pkg.name.slice(0, 3))}</div>
        <div><b>${esc(pkg.name)}</b><p>${esc(pkg.description || '')}</p></div>
      </div>
      <div class="pkg-progress">
        <div class="bar"><i style="width:${pct}%"></i></div>
        <span class="num">${pkg.completed_courses}/${pkg.total_courses}</span>
      </div>
      <div class="pkg-courses">${pkgCourseRows(pkg)}</div>
      <div style="margin-top:12px">${pkgExamBtn(pkg)}</div>
    </div>`;
  }).join('');
}
async function loadLearnOverview() {
  const { status, data } = await api('/api/portal/learn-overview?uid=' + encodeURIComponent(myUid));
  if (status === 200 && data.ok === false) return;
  const d = data.data || data;
  if (d && d.packages) renderPackages(d.packages);
}

function enterApp(me) {
  myUid = me.uid;
  if (me.role === 'trainer') {
    // 培训师：进入现有管理视图
    location.href = '/portal';
    return;
  }
  // 新人/其他角色：进主页面（双大卡），新人强制弹指引（可关闭）
  $('#v2-login').classList.add('hidden');
  $('#v2-main').classList.remove('hidden');
  $('#v2-logout').classList.remove('hidden');
  $('#v2-welcome').textContent = `欢迎你，${me.nickname || myUid}`;
  if (me.role === 'new') {
    $('#v2-open-guide').classList.remove('hidden');
    $('#v2-guide-modal').classList.remove('hidden');
  }
  if (me.is_new_user) toast('已为你自动建档，欢迎加入！');
  loadLearnOverview();
}

function v2GoPackage(key) {
  location.href = EXAM_URL + '/learn/package/' + key + '?uid=' + encodeURIComponent(myUid);
}

$('#v2-submit').addEventListener('click', doLogin);
$('#v2-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('#v2-go-query').addEventListener('click', () => {
  location.href = EXAM_URL + '/query?uid=' + encodeURIComponent(myUid);
});
$('#v2-logout').addEventListener('click', async () => {
  await api('/api/portal/logout', { method: 'POST' });
  location.reload();
});
$('#v2-guide-close').addEventListener('click', () => $('#v2-guide-modal').classList.add('hidden'));
$('#v2-guide-golearn').addEventListener('click', () => v2GoPackage('sister'));
$('#v2-open-guide').addEventListener('click', () => $('#v2-guide-modal').classList.remove('hidden'));

// 已登录：按身份分流
(async function init() {
  const { status, data } = await api('/api/portal/me');
  if (status === 200 && data.ok) {
    enterApp({ uid: data.trainer.uid, nickname: data.trainer.nickname, role: data.role });
  }
})();
</script>
</body>
</html>
