<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 培训师系统</title>
<link rel="stylesheet" href="/style.css">
<style>
.login-box { max-width: 360px; margin: 10vh auto; }
.login-box h2 { margin-bottom: 16px; }
.login-box label { display: block; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
.login-box input { width: 100%; margin-top: 4px; }
.login-box .btn { width: 100%; padding: 10px; margin-top: 6px; }
.portal-link { text-align: center; margin-top: 14px; font-size: 13px; }
</style>
</head>
<body>
<div class="card login-box">
  <h2><svg class="logo-crown" viewBox="0 0 24 24" fill="#5b2a06" aria-hidden="true"><path d="M3 19 L4.5 7 L9 10.5 L12 4 L15 10.5 L19.5 7 L21 19 Z M4 21 L20 21 L20 18.5 L4 18.5 Z"/></svg> 管理员登录</h2>
  <label>账号 <input id="login-username" type="text" value="admin" autocomplete="username"></label>
  <label>密码 <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入管理员密码"></label>
  <button id="login-submit" class="btn primary">登录</button>
  <div class="portal-link"><a href="/portal">我是培训师，去用户端 →</a></div>
</div>
<div id="toast" class="hidden"></div>
<script>
const $ = (s) => document.querySelector(s);
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  setTimeout(() => el.classList.add('hidden'), 3000);
}
async function doLogin() {
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#login-username').value.trim(), password: $('#login-password').value }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.msg || '登录失败');
    location.href = '/';
  } catch (e) {
    toast(e.message, true);
  }
}
$('#login-submit').addEventListener('click', doLogin);
$('#login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
