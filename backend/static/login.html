<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 培训师系统</title>
<link rel="icon" href="/logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/brand.css">
<style>
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
}
.login-logo { margin-bottom: 26px; }
.login-logo img {
  width: 148px; height: 148px; border-radius: 32px;
  box-shadow: 0 12px 32px rgba(122, 62, 18, .2);
}
.login-card {
  width: 380px; max-width: 92vw; padding: 28px 30px;
}
.login-card h2 { font-size: 20px; color: var(--brand-brown); text-align: center; margin-bottom: 6px; }
.login-card .sub { font-size: 13px; color: rgba(91,42,6,.55); text-align: center; margin-bottom: 22px; }
.login-card label { display: block; margin-bottom: 14px; font-size: 13px; color: rgba(91,42,6,.7); }
.login-card input { width: 100%; margin-top: 6px; padding: 10px 12px; border-radius: 8px; }
.login-card .btn { width: 100%; padding: 11px; margin-top: 8px; border-radius: 8px; font-size: 15px; }
.portal-link { text-align: center; margin-top: 16px; font-size: 13px; }
.portal-link a { color: var(--brand-brown-mid); }
</style>
</head>
<body>
<div class="bg-decor"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i></div>
<div class="login-logo"><img src="/logo.jpg" alt="点点开黑 LOGO"></div>
<div class="card login-card">
  <h2>管理员登录</h2>
  <div class="sub">使用管理员账号进入完整后台</div>
  <label>账号 <input id="login-username" type="text" value="admin" autocomplete="username"></label>
  <label>密码 <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入管理员密码"></label>
  <button id="login-submit" class="btn primary">登录</button>
  <div class="portal-link"><a href="/portal">我是培训师，去用户端 →</a></div>
</div>
<footer class="app-footer">
  <div class="footer-lines"><span></span><span></span><span></span></div>
  <div class="footer-text">点点开黑 · 享受开黑乐趣</div>
</footer>
<div id="toast" class="hidden"></div>
<script>
const $ = (s) => document.querySelector(s);
function toast(msg, isError = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  setTimeout(() => el.classList.add('hidden'), 3000);
}
async function doLogin() {
  try {
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('#login-username').value.trim(), password: $('#login-password').value }),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.msg || '登录失败');
    location.href = '/';
  } catch (e) {
    toast(e.message, true);
  }
}
$('#login-submit').addEventListener('click', doLogin);
$('#login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
